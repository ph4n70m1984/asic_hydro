[platformio]
; Пути к исходникам и заголовочным файлам
src_dir = esp32/src
include_dir = esp32/src

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200

; Максимальная производительность процессора (240 МГц)
board_build.f_cpu = 240000000L

; Зависимости: только PubSubClient для MQTT
lib_deps =
    dlloydev/QuickPID @ ^3.1.9
    knolleary/PubSubClient@^2.8
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    ModbusMaster

; Стандартная таблица разделов под OTA-обновления
board_build.partitions = default.csv
platform_packages = platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b

build_flags =
    -D CONFIG_ARDUINO_LOOP_STACK_SIZE=8192
    -D CORE_DEBUG_LEVEL=0